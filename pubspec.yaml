name: ble_acr1555u_sdk
description: >
  Flutter Android plugin for ACS ACR1555U BLE/NFC readers with CCID and PC/SC APIs.
version: 0.3.0
repository: https://github.com/ohdonpiano/ble_acr1555u_sdk
issue_tracker: https://github.com/ohdonpiano/ble_acr1555u_sdk/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ohdonpiano.ble_acr1555u_sdk
        pluginClass: BleAcr1555uSdkPlugin
