group = "com.ohdonpiano.ble_acr1555u_sdk"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.ohdonpiano.ble_acr1555u_sdk"
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // BLE Central role richiede API 21+; requestMtu/permessi runtime granulari BLUETOOTH_SCAN/CONNECT da API 31+.
        minSdk = 21
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}
